# What Belgian households spend, as a reference to sit next to your own figures (#43).
#
# Balancr reads this file to answer one question: "is what I spend on housing unusual for
# a Belgian household?" It ships filled in and is used in place, so nothing here needs
# setting up. Point BENCHMARK_PATH at a copy on your data volume if you want to correct a
# figure without waiting for a release:
#
#   cp config/statbel-benchmark.yaml data/statbel-benchmark.yaml    # local
#   BENCHMARK_PATH=/data/statbel-benchmark.yaml                     # in a container
#
# WHERE THESE FIGURES COME FROM, AND WHAT `status` MEANS (#290). Every block below now
# says `status: confirmed`: the shares and the reference household were derived from the
# survey's own XLSX download rather than read off the summary page, and the equivalence
# scale was checked against Eurostat's glossary. That is why no caveat appears beside a
# comparison drawn from this file.
#
# `transcribed` is the status that puts one there, and it is the status to set again if
# you edit a figure here without checking it at the source — along with `last_verified`,
# so the page can say how old the claim is. Balancr never hides a figure it cannot vouch
# for; it labels it. Editing a number and leaving `confirmed` in place is the one thing
# that breaks that, because it is the file lying rather than the code.
#
# What this file is not: a target, a budget, or a verdict. It is what other households
# did. A household with no car spends nothing on transport and is not doing anything
# wrong; a comparison is context, which is why Balancr never raises a benchmark
# difference above `info` and never turns one into a suggestion.
#
# Structure, and why there are two kinds of comparison.
#
#   `groups` are the ten lines of Statbel's summary table, each with its share of the
#   total household budget in basis points (1400 = 14,00%) and the COICOP divisions it
#   covers. Shares are what makes the *mix* comparison possible — how your spending is
#   divided, against how theirs is — and that needs no euro amount and no household size
#   at all. This is the comparison Balancr always draws.
#
#   `reference_household` carries the average household's monthly total in cents plus its
#   size on the equivalence scale, which is what a *level* comparison needs: "you spend
#   more on food than a comparable household", not just "food is a bigger share of your
#   budget". Neither number is on the summary page — both are derived from the survey's
#   own spreadsheet — which is why the block shipped commented out until #290 and why it
#   carries its own citation and its own derivation notes.
#
#   `equivalence` is the scale used to make your household comparable to the average one.
#   It only matters for the level comparison; the mix comparison ignores it.
#
# COICOP is the international classification of household consumption that Statbel
# publishes against. Divisions 01–12 cover consumption. Balancr reserves the code `00`
# for everything that is not household consumption at all — savings, investments, taxes,
# transfers, debt repayment — because a budget contains plenty of those and counting them
# as consumption would make every other share look small. Categories mapped to `00` are
# left out of the comparison entirely rather than counted as unmapped.

version: 1
jurisdiction: BE

# ---------------------------------------------------------------------------
#  Where the shares come from.
# ---------------------------------------------------------------------------
source:
  survey: 'Household Budget Survey (HBS)'
  year: 2024
  citation: 'Statbel, Household Budget Survey 2024 — structure of household expenditure'
  source_url: 'https://statbel.fgov.be/en/themes/households/household-budget-survey-hbs'
  last_verified: '2026-09-07'
  status: confirmed
  notes: >-
    Shares of total household expenditure over 5.696 sampled Belgian households, derived
    from sheet HBS_Tab01_BE_2024 of the survey's XLSX download: each COICOP division's
    mean annual expenditure over the total for COICOP 0 (TOTALE CONSUMPTIE). Divisions
    01-12 sum to that total to the cent, so the ten shares below cover consumption exactly
    and no residual is unaccounted for. Figures are population-weighted by Statbel, not
    raw sample means.

# ---------------------------------------------------------------------------
#  The scale that makes two households comparable.
# ---------------------------------------------------------------------------
#
# The modified OECD scale, which Eurostat uses for equivalised income: the first adult
# counts 1,0, every further person aged 14 or over counts 0,5, and every child under 14
# counts 0,3. A single parent with one young child is therefore 1,3 "equivalent adults",
# and spends less than an average household of 2,3 without spending unusually.
#
# The scale says nothing about part-time household membership. Balancr prorates a child's
# weight by the custody share you enter, and says so on screen every time it does: that
# proration is Balancr's own assumption, not something the published scale supports.
equivalence:
  scale: modified_oecd
  first_person_bp: 10000
  additional_person_bp: 5000
  child_bp: 3000
  child_age_below: 14
  citation: 'Eurostat — equivalised disposable income, modified OECD scale'
  source_url: 'https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Glossary:Equivalised_disposable_income'
  last_verified: '2026-09-07'
  status: confirmed
  notes: >-
    Checked against the Eurostat glossary: 1,0 to the first adult, 0,5 to the second and
    each subsequent person aged 14 and over, 0,3 to each child aged under 14. Statbel
    applies the same scale for the per-consumption-unit column the reference household
    below is derived from, wording the threshold as "older than 13" — the same rule. That
    the two agree is what makes dividing one by the other meaningful.

# ---------------------------------------------------------------------------
#  The average household in euros (#290).
# ---------------------------------------------------------------------------
#
# This is what turns the *level* comparison on: your spending against what a household of
# your size on the scale above spends, in euros, per month. Without it only the mix
# comparison appears, and the mix comparison divides by your own total — so household size
# cancels out of it entirely and a single-parent household is compared to itself.
#
# Both numbers come from sheet HBS_Tab01_BE_2024, row COICOP 0 (TOTALE CONSUMPTIE), of the
# survey's XLSX download. Three columns of that row matter:
#
#   E  mean expenditure per household per year        € 44.270,26
#   F  mean expenditure per person per year           € 20.620,15
#   G  mean expenditure per consumption unit per year € 29.383,46
#
# `mean_monthly_cents` is E ÷ 12 × 100. `equivalent_adults_bp` is **E ÷ G**, not E ÷ F:
# both columns are population-weighted totals over the same households, so their ratio is
# the mean number of consumption units per household — 1,5066. E ÷ F is the mean size in
# persons (2,1469), which is the figure the equivalence scale exists in order not to use.
#
# The division is only meaningful because column G uses the same scale as the `equivalence`
# block above. Statbel says so on the survey page, wording the threshold as "older than
# 13" where Eurostat words it as "14 and over". If a future edition changes its scale, this
# ratio stops being comparable to a household size computed here, and the fix is to change
# both blocks together rather than to update this one.
#
# To refresh it for a new survey year: download the XLSX linked from `source.source_url`,
# open the Tab01 sheet for Belgium, read E and G off the COICOP 0 row, and recompute. Then
# set `source.year` and every `last_verified` to match what you read.
#
# Or don't touch the file at all: Settings → Benchmark can override both numbers, which is
# the route for a container install with no way to edit a file on disk. An override is
# marked `transcribed` on screen, because Balancr cannot vouch for a figure somebody typed.
reference_household:
  mean_monthly_cents: 368919
  equivalent_adults_bp: 15066
  citation: 'Statbel, Household Budget Survey 2024 — mean expenditure per household and per consumption unit'
  source_url: 'https://statbel.fgov.be/en/themes/households/household-budget-survey-hbs'
  last_verified: '2026-09-07'
  status: confirmed
  notes: >-
    Derived from sheet HBS_Tab01_BE_2024, row COICOP 0, of the 2024 XLSX download.
    Monthly total is € 44.270,26 per year ÷ 12. Household size is € 44.270,26 ÷ €
    29.383,46 per consumption unit = 1,5066 equivalent adults on the modified OECD scale,
    the same scale as the equivalence block above. Statbel counts imputed rent for
    owner-occupiers in the housing division, which Balancr's own figures do not, so an
    owner without a mortgage reads well below the reference for that reason alone.

# ---------------------------------------------------------------------------
#  The ten lines of the summary table.
# ---------------------------------------------------------------------------
#
# `id` is a fixed vocabulary: the same ten ids appear in the code and in both catalogues,
# so a group cannot be renamed here without failing the load. `coicop` lists the
# divisions the group covers; between them the ten groups cover 01–12 exactly once, which
# the loader checks.
#
# Each share is the group's divisions' mean annual expenditure over the total for COICOP 0,
# computed from the XLSX rather than read off the summary page (#290). The summary page's
# own rounding was right to within 3 basis points on every line — 0,03 of a percentage
# point, which moves no comparison — so this is a confirmation rather than a correction.
# The two columns both sum to exactly 10 000, which the loader also checks.
groups:
  - id: food
    share_bp: 1397
    coicop: ['01']

  - id: alcohol_tobacco
    share_bp: 171
    coicop: ['02']

  - id: clothing
    share_bp: 372
    coicop: ['03']

  # The largest line by a wide margin, and the one a mortgage or a rent lands in. Statbel
  # counts imputed rent for owner-occupiers here, which Balancr's figures do not: an
  # owner without a mortgage will read as far below the reference for that reason alone.
  - id: housing
    share_bp: 3058
    coicop: ['04']

  - id: furnishings
    share_bp: 502
    coicop: ['05']

  # Out-of-pocket health spending only. Belgian social security carries most of the cost
  # elsewhere, which is why the share is small.
  - id: health
    share_bp: 480
    coicop: ['06']

  - id: transport
    share_bp: 1170
    coicop: ['07']

  - id: recreation
    share_bp: 792
    coicop: ['09']

  - id: hotels_restaurants
    share_bp: 730
    coicop: ['11']

  # Statbel's own residual line, and it is genuinely three divisions: communication (08),
  # education (10) and miscellaneous goods and services (12) — insurance, childcare,
  # personal care, bank charges. Split out in the table Balancr reads, so split out here.
  - id: other
    share_bp: 1328
    coicop: ['08', '10', '12']
