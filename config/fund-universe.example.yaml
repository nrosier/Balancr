# The fund universe — the only instruments Balancr's advice may propose (#40).
#
# Copy this file somewhere Balancr can read it and point FUND_UNIVERSE_PATH at it:
#
#   cp config/fund-universe.example.yaml data/fund-universe.yaml   # local
#   FUND_UNIVERSE_PATH=/data/fund-universe.yaml                    # in a container
#
# Then read it. Copying this file is not the same as having vetted it, and the app
# cannot tell the difference — which is what `last_verified` is for. Every line below
# was transcribed from a product page while this template was written; the ISINs are
# check-digit valid, and that is the only claim the code can verify. Whether the name
# beside an ISIN is the right fund, whether that TER is this year's, and whether the
# share class is the accumulating one are things a person confirms, once, with the KID
# open — and then writes the date.
#
# Three rules the loader enforces, and why:
#
#   accumulating only  A distributing class pays out dividends that Belgian roerende
#                      voorheffing taxes at 30% every year. The accumulating class of
#                      the same index reinvests inside the fund. They are not
#                      interchangeable, so only one of them belongs in a list of things
#                      to propose.
#   EEA domicile       A UCITS fund domiciled in the EEA has a KID and a broker who can
#                      sell it to you. A US-domiciled ETF has neither, however good its
#                      TER looks — this is why VTI is not on this list and IWDA is.
#   ter_percent        Percent per year. `0.2` is twenty basis points, not twenty
#                      percent. The key is spelled this way because a factor of a
#                      hundred in this field would be invisible in every screen that
#                      shows it.
#
# An entry older than FUND_UNIVERSE_MAX_AGE_DAYS (365 by default) stops being
# proposable until somebody re-checks it. That is deliberate: a list everybody agrees
# should be reviewed some day never is, unless it stops working.
#
# There is no requirement to keep any of these. A universe of three funds you
# understand is worth more than eleven you copied.

version: 1

