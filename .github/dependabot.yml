version: 2
updates:
  # Actions in ci.yml/image.yml/release.yml are pinned to a commit SHA with
  # a trailing `# vX` comment. Dependabot reads that comment to know which
  # tag to re-resolve, and opens a PR that bumps both the SHA and the comment
  # when a new release lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Dockerfile's Chainguard base images are pinned by digest
  # (cgr.dev/chainguard/node@sha256:...). Chainguard's free tier only
  # publishes `latest`/`latest-dev`, not versioned tags, so Dependabot can't
  # diff a version bump here the way it does for actions — but it still
  # detects that the digest a floating tag resolves to has moved and opens a
  # PR with the new one, which is the bump this entry exists for.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
