name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing; cancel it and keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions below are pinned to a commit SHA, not a floating tag (GitHub's own
# recommended convention: https://docs.github.com/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions).
# The trailing `# vX` comment is what Dependabot/Renovate read to find and
# open the bump PR when a new release lands — see .github/dependabot.yml.
jobs:
  verify:
    name: Typecheck, i18n, tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Catalogue drift is silent by nature: a missing Dutch key renders as the
      # key itself, which nobody notices until a screenshot.
      - name: i18n parity
        run: npm run i18n:check

      # The release and licence badges are static because shields.io cannot read a
      # private repo; this is what stops them quoting last month's version.
      - name: README badges
        run: npm run badges:check

      # `npm test` asserts the same floor, but only this prints the table: every pair
      # with its measured ratio and how much room it has left. A pair passing by 0.25 is
      # something to know before it is repainted, not after.
      - name: Colour contrast
        run: npm run contrast:check

      # A skipped or `.only`-focused test compiles clean and the suite still passes
      # green, which is exactly why #429's `it.skip` sat unnoticed for weeks. This
      # fails the build the moment one lands instead of waiting for a human to skim
      # every test file. A genuine, time-bound exception doesn't need touching this
      # workflow or the script: mark the line `// SKIP-ALLOWED: <reason>, see #<issue>`
      # and scripts/check-test-skips.ts lets it through (and still prints it, every run).
      - name: No skipped or focused tests
        run: npm run skips:check

      - name: Tests
        run: npm test

      # Proves the release artefact compiles, and that copy-assets keeps the
      # migrations and catalogues next to the JS.
      - name: Build
        run: npm run build

      # This is a CI-side backstop independent of the Harbor scan tracked in
      # #395: it checks the production dependency tree on every push/PR,
      # regardless of whether Harbor's replication scan is reachable.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history, which needs all of it.
          fetch-depth: 0

      # Run the image directly rather than the marketplace action: no licence
      # key, and the same command works locally.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest git --redact --verbose --no-banner /repo

  semgrep-sarif:
    name: Semgrep findings (reporting only)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # semgrep ci diffs against the base branch on a PR event.
          fetch-depth: 0

      # The Semgrep GitHub App (`semgrep-cloud-platform/scan`, semgrep.dev) is
      # the actual scan and the actual policy decision — this step does not
      # duplicate that. Its only job is to hand the same findings to GitHub's
      # code-scanning alerts, because the App's own dashboard has no API this
      # repo can reach: no PR comments, no check annotations, login-gated
      # pages. `|| true` so a real finding here never fails the build — that
      # verdict belongs to the App's check, not to this reporting step.
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e SEMGREP_APP_TOKEN \
            semgrep/semgrep semgrep ci --sarif --output=semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
