name: Preview image

# Publishes a throwaway image for this UI-unification branch so it can be
# `docker pull`ed for review without touching anything release.yml owns —
# `latest`, `edge` and every semver tag stay untouched here.
#
# Scoped to one named branch rather than every branch: a preview tag per
# feature branch is a real feature, but this workflow exists to answer one
# question ("can I pull this UI rewrite to test it") and isn't meant to grow
# into a second release pipeline. Widen the `branches` list (or switch to a
# `preview/*` convention) if a next branch needs the same thing.
on:
  push:
    branches: [feat/ui-unify-settings]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BALANCR_REVISION=${{ github.sha }}
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_NAME }}/balancr:preview-ui-unify-settings
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
