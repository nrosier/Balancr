name: Release

# Publishes the image on every push to main (as `edge`) and on every version tag.
# Tagging is the release gesture: `git tag v0.3.0 && git push --tags`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_NAME }}/balancr
          # `latest` is opt-in below so a release candidate never becomes the
          # tag that `docker pull balancr` resolves to.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          # Stamped into the image so the startup log names the commit, not just
          # the version. `github.sha` is the merge commit for a branch push and the
          # tagged commit for a tag, which is the commit that was built either way.
          build-args: |
            BALANCR_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance attestations, so a pulled image carries a signed
          # record of how and where it was built (SLSA-style). `true` is
          # build-push-action's own default; kept explicit so this doesn't
          # silently regress if the action's default ever changes.
          provenance: true

  harbor-scan:
    name: Trigger Harbor replication + scan
    needs: image
    # Disabled (#395): every run 403s at the very first call, from
    # Cloudflare's WAF on the harbor.bunbun.be zone rejecting the
    # GitHub-hosted runner despite the x-ci-bypass header meant to let it
    # through. That's a fight against a WAF from outside the network it
    # protects, with no way to see from here which layer (WAF rule
    # matching, Bot Fight Mode, Authentik forward-auth) is issuing the 403.
    #
    # The fix isn't a header — it's not calling in at all. Harbor's
    # replication policies support a scheduled (cron) trigger as well as a
    # manual/API one; switching policy 1 to scheduled lets Harbor pull from
    # Docker Hub on its own from inside the homelab network, and a
    # scheduled scan-all covers the vulnerability scan the same way. Once
    # that's set up on Harbor's side, delete this job outright instead of
    # re-enabling it.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Harbor replication
        id: replicate
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_REPLICATION_POLICY_ID: ${{ vars.HARBOR_REPLICATION_POLICY_ID }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          # Lets this runner's requests skip Cloudflare's bot/WAF challenge on
          # the harbor.bunbun.be zone via a WAF custom rule matched on this
          # header — see the Cloudflare dashboard WAF custom rule for details.
          CF_CI_BYPASS_SECRET: ${{ secrets.CF_CI_BYPASS_SECRET }}
        run: |
          id="$(curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
            -H "x-ci-bypass: $CF_CI_BYPASS_SECRET" \
            -X POST "$HARBOR_URL/api/v2.0/replication/executions" \
            -H 'Content-Type: application/json' \
            -d "{\"policy_id\": $HARBOR_REPLICATION_POLICY_ID}" \
            -D - -o /dev/null | grep -i '^Location:' | grep -o '[0-9]*$' | tr -d '\r')"
          if [[ -z "$id" ]]; then
            echo 'Harbor did not return a replication execution id.' >&2
            exit 1
          fi
          echo "execution_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the replication to finish
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          EXECUTION_ID: ${{ steps.replicate.outputs.execution_id }}
          CF_CI_BYPASS_SECRET: ${{ secrets.CF_CI_BYPASS_SECRET }}
        run: |
          for _ in $(seq 1 60); do
            status="$(curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
              -H "x-ci-bypass: $CF_CI_BYPASS_SECRET" \
              "$HARBOR_URL/api/v2.0/replication/executions/$EXECUTION_ID" | jq -r '.status')"
            case "$status" in
              Succeed) echo "Replication execution $EXECUTION_ID succeeded."; exit 0 ;;
              Failed | Stopped) echo "Replication execution $EXECUTION_ID ended as $status." >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Replication execution $EXECUTION_ID never finished within 5 minutes." >&2
          exit 1

      - name: Trigger a vulnerability scan
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_REPOSITORY: ${{ vars.HARBOR_REPOSITORY }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          # Confirmed by hand: this is the only tag the replication policy
          # actually pulls, even though Docker Hub also has 1.x/edge/sha-*.
          TAG: latest
          CF_CI_BYPASS_SECRET: ${{ secrets.CF_CI_BYPASS_SECRET }}
        run: |
          curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
            -H "x-ci-bypass: $CF_CI_BYPASS_SECRET" \
            -X POST "$HARBOR_URL/api/v2.0/projects/$HARBOR_PROJECT/repositories/$HARBOR_REPOSITORY/artifacts/$TAG/scan" \
            -H 'Content-Type: application/json'
          echo "Scan triggered for $HARBOR_PROJECT/$HARBOR_REPOSITORY:$TAG"
