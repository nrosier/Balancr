name: Release

# Publishes the image on every push to main (as `edge`) and on every version tag.
# Tagging is the release gesture: `git tag v0.3.0 && git push --tags`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_NAME }}/balancr
          # `latest` is opt-in below so a release candidate never becomes the
          # tag that `docker pull balancr` resolves to.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Stamped into the image so the startup log names the commit, not just
          # the version. `github.sha` is the merge commit for a branch push and the
          # tagged commit for a tag, which is the commit that was built either way.
          build-args: |
            BALANCR_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
