# gitleaks configuration.
#
# The default rule set does the work; this file exists for the allowlist, and
# the allowlist is deliberately narrow — every entry is a place where a
# secret-shaped string is provably not a secret.
[extend]
useDefault = true

# Array-of-tables form: the schema gitleaks >= v8.21 (the pinned v8.30.1 in
# ci.yml included) actually uses for global allowlists. The legacy singular
# `[allowlist]` table still parses, but isn't what this version's own default
# config or test fixtures write (#725).
[[allowlists]]
description = "Placeholders and test fixtures"
paths = [
  '''\.env\.example$''',
  '''^test/setup\.ts$''',
]
regexes = [
  # The one secret-shaped example value anywhere in README.md, in the backup
  # walkthrough's placeholder passphrase — narrower than exempting the whole
  # file, so a real secret pasted anywhere else in it still gets caught (#725).
  '''write-this-down-somewhere-else''',
]
